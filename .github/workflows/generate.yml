name: Generate SDK

# Regenerate this client from the OpenAPI spec in invoicepdfs-openapi.
# Run manually (Actions tab) or triggered automatically when the spec updates.
# Requires org/repo secret SDK_SYNC_TOKEN (read access to invoicepdfs-openapi).

on:
  workflow_dispatch:
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: write

concurrency:
  group: generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest OpenAPI spec
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/invoicepdfs/invoicepdfs-openapi/contents/openapi-3.0.json?ref=main" \
            -o openapi.json

      # This generator's default is a literal 1.0.0, and unlike typescript-fetch and
      # java it does not fall back to the spec's version — so the package declared
      # 1.0.0 while the API was on 0.3.0. Take it from the spec, which the API repo
      # bumps on release, instead of hardcoding it here where it would drift again.
      - name: Read package version from the spec
        id: spec
        run: |
          version=$(jq -er .info.version openapi.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read info.version from the spec."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging as $version"

      - name: Generate client (csharp)
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.7.0 generate \
            -i /local/openapi.json -g csharp -o /local \
            --additional-properties="packageName=InvoicePDFs,packageVersion=${{ steps.spec.outputs.version }}"

      - name: Commit regenerated client
        run: |
          rm -f openapi.json
          git config user.name "invoicepdfs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Regenerate client from OpenAPI spec"
            for a in 1 2 3 4 5; do
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
              git push && break
              echo "push retry $a"; sleep $((a * 3))
            done
          fi
